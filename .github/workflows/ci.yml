name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: CI / Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: promocode_service
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d promocode_service"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-hmac-sha256
      DJANGO_DEBUG: "False"
      DB_NAME: promocode_service
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379
      CACHE_URL: redis://127.0.0.1:6379/1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --all-groups

      - name: Run Django checks
        run: uv run python app/manage.py check

      - name: Check migration drift
        run: uv run python app/manage.py makemigrations --check --dry-run

      - name: Lint Python
        run: uv run ruff check app

      - name: Run backend tests
        run: uv run python app/manage.py test

  frontend:
    name: CI / Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: CI / Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build backend image
        run: docker build --target backend --tag gear-drop-backend:ci .

      - name: Build web image
        run: docker build --target web --tag gear-drop-web:ci .

  backup-recovery:
    name: CI / PostgreSQL backup recovery
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: promocode_service
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d promocode_service"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create data to back up
        run: >-
          docker run --rm --network host
          -e PGPASSWORD=postgres postgres:17-alpine
          psql --host=127.0.0.1 --username=postgres
          --dbname=promocode_service --set=ON_ERROR_STOP=1
          --command "CREATE TABLE django_migrations (id integer PRIMARY KEY); INSERT INTO django_migrations (id) VALUES (1);"

      - name: Back up and restore PostgreSQL
        run: |
          mkdir -p "$RUNNER_TEMP/backups"
          docker run --rm --network host \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=5432 \
            -e DB_NAME=promocode_service \
            -e DB_USER=postgres \
            -e DB_PASSWORD=postgres \
            -v "$GITHUB_WORKSPACE/deploy/backup:/scripts:ro" \
            -v "$RUNNER_TEMP/backups:/backups" \
            postgres:17-alpine sh /scripts/backup-postgres
          docker run --rm --network host \
            -e PGPASSWORD=postgres postgres:17-alpine \
            psql --host=127.0.0.1 --username=postgres \
            --dbname=promocode_service --set=ON_ERROR_STOP=1 \
            --command "CREATE TABLE restore_probe (id integer);"
          backup_file="$(find "$RUNNER_TEMP/backups" -name '*.dump' -print -quit)"
          docker run --rm --network host \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=5432 \
            -e DB_NAME=promocode_service \
            -e DB_USER=postgres \
            -e DB_PASSWORD=postgres \
            -v "$GITHUB_WORKSPACE/deploy/backup:/scripts:ro" \
            -v "$RUNNER_TEMP/backups:/backups" \
            postgres:17-alpine sh /scripts/restore-postgres \
            --confirm "${backup_file##*/}"
          docker run --rm --network host \
            -e PGPASSWORD=postgres postgres:17-alpine \
            psql --host=127.0.0.1 --username=postgres \
            --dbname=promocode_service --tuples-only --no-align \
            --command "SELECT to_regclass('public.restore_probe') IS NULL AND EXISTS (SELECT 1 FROM django_migrations WHERE id = 1);" \
            | grep -x t

  full-stack:
    name: CI / Full-stack browser test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: promocode_service
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d promocode_service"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-hmac-sha256
      DJANGO_DEBUG: "False"
      DB_NAME: promocode_service
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379
      CACHE_URL: redis://127.0.0.1:6379/1
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          uv sync --frozen --all-groups
          npm ci --prefix frontend

      - name: Prepare live backend
        run: |
          uv run python app/manage.py migrate --noinput
          uv run python app/manage.py shell -c "from accounts.models import User; User.objects.create_user('ci-user@example.com', 'StrongPassword123!', is_email_verified=True)"

      - name: Install Playwright browser
        run: npm --prefix frontend exec playwright install --with-deps chromium

      - name: Run full-stack browser test
        run: npm --prefix frontend run test:full-stack

      - name: Upload full-stack artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-playwright-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7
