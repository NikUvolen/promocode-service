x-log-options: &log-options
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *log-options
    env_file:
      - path: ${ENV_FILE:-.env.production}
        format: raw
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *log-options
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: promocode-service-backend
    build:
      context: .
      target: backend
    restart: unless-stopped
    logging: *log-options
    volumes:
      - media_data:/srv/app/app/media
    env_file:
      - path: ${ENV_FILE:-.env.production}
        format: raw
    command:
      - /bin/sh
      - -c
      - >-
        exec gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers $${GUNICORN_WORKERS:-2}
        --timeout $${GUNICORN_TIMEOUT:-60}
        --access-logfile -
        --error-logfile -
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    image: promocode-service-backend
    build:
      context: .
      target: backend
    restart: "no"
    logging: *log-options
    env_file:
      - path: ${ENV_FILE:-.env.production}
        format: raw
    command: python manage.py migrate --noinput
    depends_on:
      db:
        condition: service_healthy

  worker-critical:
    image: promocode-service-backend
    build:
      context: .
      target: backend
    restart: unless-stopped
    logging: *log-options
    env_file:
      - path: ${ENV_FILE:-.env.production}
        format: raw
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=INFO
      - --queues=critical,notifications
      - --concurrency=1
      - --prefetch-multiplier=1
      - --hostname=critical@%h
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker-bulk:
    image: promocode-service-backend
    build:
      context: .
      target: backend
    restart: unless-stopped
    logging: *log-options
    volumes:
      - media_data:/srv/app/app/media
    env_file:
      - path: ${ENV_FILE:-.env.production}
        format: raw
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=INFO
      - --queues=bulk
      - --concurrency=1
      - --prefetch-multiplier=1
      - --max-tasks-per-child=10
      - --hostname=bulk@%h
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    image: promocode-service-backend
    build:
      context: .
      target: backend
    restart: unless-stopped
    logging: *log-options
    env_file:
      - path: ${ENV_FILE:-.env.production}
        format: raw
    command: celery -A config beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: promocode-service-web
    build:
      context: .
      target: web
    restart: unless-stopped
    logging: *log-options
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
