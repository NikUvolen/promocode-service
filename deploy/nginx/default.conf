upstream gear_drop_backend {
    server backend:8000;
}

map $http_x_forwarded_proto $gear_drop_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    location = /health/ {
        proxy_pass http://gear_drop_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $gear_drop_forwarded_proto;
    }

    location /api/ {
        proxy_pass http://gear_drop_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gear_drop_forwarded_proto;
    }

    location /admin/ {
        proxy_pass http://gear_drop_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $gear_drop_forwarded_proto;
    }

    location /static/ {
        proxy_pass http://gear_drop_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $gear_drop_forwarded_proto;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
